[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "immiscible-diffusion-policy"
version = "0.1.0"
description = "Hungarian noise assignment for diffusion-policy training"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["torch>=1.12", "scipy>=1.9"]

[project.optional-dependencies]
examples = ["PyYAML>=6"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.packages.find]
include = ["immiscible_diffusion_policy*"]
